<html lang="en">
<head>

<title>Teacher Assistant Myanmar V1</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e6e8ef;--primary:#5b5bd6;--primary2:#4545b9;--soft:#eeeefe;--good:#178a5b;--warn:#bc7411;--bad:#c2414d;--shadow:0 10px 30px #1a1d3a0d;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Noto Sans Myanmar",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}[hidden]{display:none!important}.app{max-width:1180px;margin:auto;min-height:100vh}.topbar{height:72px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{height:38px;width:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7778ee,#4545b9);color:white;font-size:20px}.top-actions{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--primary);font-size:18px}.main{padding:24px 20px 100px}.view{display:none}.view.active{display:block}.hello{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--primary);font-weight:700;font-size:13px}.h1{font-size:clamp(25px,4vw,34px);margin:4px 0}.date{color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;gap:10px}.stat .value{font-size:29px;font-weight:800;margin-top:5px}.stat .label{color:var(--muted);font-size:13px}.stat .emoji{font-size:24px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 12px}.btn{padding:11px 15px;border-radius:12px;font-weight:700;background:var(--soft);color:var(--primary);white-space:nowrap}.btn.primary{background:var(--primary);color:#fff}.btn.danger{color:var(--bad);background:#fff0f1}.btn.small{padding:8px 11px;font-size:13px}.btn:active{transform:translateY(1px)}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.item-main{min-width:0}.item-title{font-weight:750}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--primary);margin:3px 3px 0 0}.pill.good{color:var(--good);background:#e7f7ef}.pill.warn{color:var(--warn);background:#fff5df}.pill.bad{color:var(--bad);background:#fff0f1}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{text-align:center;padding:25px;color:var(--muted)}.progress{height:9px;border-radius:99px;background:#eceef5;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7778ee,var(--primary));border-radius:inherit}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1180px);height:68px;background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:space-around;z-index:6}.nav-btn{background:transparent;color:var(--muted);font-size:11px;display:grid;place-items:center;gap:2px;padding:7px 12px}.nav-btn span:first-child{font-size:20px}.nav-btn.active{color:var(--primary);font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:180px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:700;font-size:13px}.field small{color:var(--muted)}input,select,textarea{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--card);color:var(--text);width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5b5bd622}textarea{min-height:80px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.full{grid-column:1/-1}.checkrow{display:flex;gap:12px;flex-wrap:wrap}.checkrow label{font-weight:500;display:flex;align-items:center;gap:6px}.checkrow input{width:auto}.modal{position:fixed;inset:0;background:#12142675;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.modal.show{display:flex}.modal-box{background:var(--card);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{background:var(--soft);border-radius:10px;width:34px;height:34px}.toast{position:fixed;top:83px;right:18px;background:#172033;color:white;padding:12px 16px;border-radius:12px;display:none;z-index:20}.toast.show{display:block}.welcome{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#dcdcff,transparent 35%),var(--bg)}.welcome-card{width:min(560px,100%);text-align:center}.welcome .logo{margin:0 auto 20px;width:68px;height:68px;font-size:32px}.welcome h1{font-size:clamp(32px,8vw,52px);margin:0 0 10px}.welcome p{color:var(--muted);font-size:17px}.welcome-actions{display:flex;justify-content:center;gap:10px;margin-top:28px}.setup-note{background:var(--soft);padding:12px;border-radius:12px;color:var(--primary);font-size:13px;margin-top:20px}.dark{--bg:#11131e;--card:#1b1e2b;--text:#f2f4fa;--muted:#a6adc0;--line:#303547;--soft:#292c46;--shadow:none}.dark .bottomnav{background:#171a26f2}.dark input,.dark select,.dark textarea{background:#161925}.kicker{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.calendar-strip{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.day-chip{min-width:55px;padding:8px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}.day-chip strong{display:block}.day-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.main{padding:18px 14px 92px}.topbar{padding:0 14px}.brand small{display:none}}@media(max-width:480px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.hello{display:block}.hello .btn{margin-top:12px}.item{display:block}.item .actions{justify-content:flex-start;margin-top:10px}}

.global-search{max-width:300px;flex:1;margin-left:auto}.fab{position:fixed;right:max(20px,calc((100vw - 1180px)/2 + 20px));bottom:84px;width:54px;height:54px;border-radius:18px;background:var(--primary);color:#fff;font-size:28px;box-shadow:0 10px 24px #5b5bd655;z-index:7}.fab-menu{position:fixed;right:max(20px,calc((100vw - 1180px)/2 + 20px));bottom:145px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:none;z-index:7}.fab-menu.show{display:grid;gap:4px}.fab-menu button{padding:9px 12px;text-align:left;border-radius:10px;background:transparent;color:var(--text)}.fab-menu button:hover{background:var(--soft)}.next-card{background:linear-gradient(135deg,#3f409f,#6d6fe2);color:#fff;border:0;overflow:hidden;position:relative}.next-card:after{content:'✦';position:absolute;right:25px;top:12px;font-size:110px;color:#fff1;line-height:1}.next-card .muted,.next-card .eyebrow{color:#e4e5ff}.next-time{font-size:30px;font-weight:800;margin:8px 0}.timeline{position:relative;margin-top:8px;padding-left:54px}.timeline:before{content:'';position:absolute;left:22px;top:6px;bottom:6px;width:2px;background:var(--line)}.time-item{position:relative;padding:0 0 20px}.time-item:before{content:'';position:absolute;left:-38px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--line);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}.time-item.current:before{background:var(--primary);box-shadow:0 0 0 3px #5b5bd633}.time-item.done{opacity:.55}.time-label{position:absolute;left:-54px;top:0;color:var(--muted);font-size:12px;font-weight:700}.search-results{position:absolute;top:58px;right:20px;width:min(420px,calc(100vw - 40px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:none;z-index:8}.search-results.show{display:block}.notification-list{display:grid;gap:8px}.notification-list div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px}@media(max-width:800px){.global-search{display:none}}
</style>

<body>
<div id="welcome" class="welcome" hidden><div class="welcome-card"><div class="logo">✦</div><div class="kicker">Myanmar Teacher Productivity</div><h1>Teacher Assistant</h1><p>သင်ကြားချိန်၊ စာပြင်ဆင်မှုနဲ့ ကျောင်းသားစီမံခန့်ခွဲမှုကို တစ်နေရာတည်းမှာ စီမံပါ</p><div class="welcome-actions"><button class="btn primary" onclick="openSetup()">စတင်အသုံးပြုမည်</button><button class="btn" onclick="continueApp()">ရှိပြီးသားဒေတာ ပြန်သုံးမည်</button><button class="btn" onclick="demo()">နမူနာဒေတာကြည့်မည်</button></div><div class="setup-note">Offline app • Your data stays in this browser</div></div></div>
<div id="app" class="app" hidden><header class="topbar"><div class="brand"><div class="logo">✦</div><div>Teacher Assistant <small style="color:var(--muted);font-weight:500">ဆရာ/ဆရာမအတွက်</small></div></div><input class="global-search" id="globalSearch" placeholder="ရှာဖွေရန်…" oninput="globalSearch(this.value)"><div class="top-actions"><button class="icon-btn" title="အသိပေးချက်များ" onclick="showView('other')">🔔</button><button class="icon-btn" title="အလင်း/အမှောင်" onclick="toggleTheme()">◐</button></div><div id="searchResults" class="search-results"></div></header><main class="main"><section id="dashboard" class="view active"></section><section id="schedule" class="view"></section><section id="lessons" class="view"></section><section id="students" class="view"></section><section id="tasks" class="view"></section><section id="fees" class="view"></section><section id="backup" class="view"></section><section id="other" class="view"></section></main><nav class="bottomnav"><button class="nav-btn active" data-view="dashboard"><span>⌂</span>ပင်မ</button><button class="nav-btn" data-view="schedule"><span>▦</span>အချိန်ဇယား</button><button class="nav-btn" data-view="lessons"><span>✎</span>သင်ခန်းစာ</button><button class="nav-btn" data-view="students"><span>♙</span>ကျောင်းသား</button><button class="nav-btn" data-view="other"><span>☰</span>အခြား</button></nav><button class="fab" onclick="toggleFab()">＋</button><div id="fabMenu" class="fab-menu"><button onclick="quickAdd('class')">＋ စာသင်ချိန်</button><button onclick="quickAdd('lesson')">＋ သင်ခန်းစာ</button><button onclick="quickAdd('student')">＋ ကျောင်းသား</button><button onclick="quickAdd('task')">＋ အိမ်စာ / စာမေးပွဲ</button><button onclick="quickAdd('fee')">＋ ကျူရှင်ကြေး</button></div></div>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">Form</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], SUBJECTS=['Myanmar','English','Mathematics','Physics','Chemistry','Biology','Geography','History','Other'];
const KEY='teacherAssistantMyanmarV1';
const blank={setup:false,teacher:'',mainSubjects:[],workingDays:['Monday','Tuesday','Wednesday','Thursday','Friday'],duration:90,reminder:15,theme:'light',classes:[],lessons:[],students:[],tasks:[],fees:[],batches:['Grade 10 A','Grade 10 B','Weekend Class','Online Class']};
let db=load(), current='dashboard';
function load(){try{return {...blank,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...blank}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function todayName(){return DAYS[(new Date().getDay()+6)%7]}; function dateKey(d=new Date()){return d.toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '—';return new Date(d+'T00:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function escAttr(v=''){return esc(v).replace(/`/g,'&#96;')}
function renderOther(){const unpaid=db.fees.filter(x=>x.status!=='Paid').length, pending=db.lessons.filter(x=>x.status!=='Completed').length;document.getElementById('other').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">စီမံခန့်ခွဲမှု</div><h1 class="h1">အခြား</h1></div></div><div class="card"><h2>အသိပေးချက်များ</h2><div class="notification-list"><div>🔔 ${unpaid} ယောက် ကျူရှင်ကြေး မပေးရသေးပါ</div><div>📚 ${pending} ခု စာပြင်ဆင်ရန် ကျန်နေပါသည်</div><div>📝 ယနေ့အတွက် အလုပ်များကို စစ်ဆေးပါ</div></div></div><div class="grid two" style="margin-top:16px"><button class="card" style="text-align:left" onclick="showView('tasks')"><h3>အိမ်စာ / စာမေးပွဲ</h3><div class="muted">လုပ်ရန်နှင့် စာမေးပွဲအစီအစဉ်များ</div></button><button class="card" style="text-align:left" onclick="showView('fees')"><h3>ကျူရှင်ကြေး</h3><div class="muted">ပေးပြီး / မပေးရသေး စာရင်း</div></button><button class="card" style="text-align:left" onclick="showView('backup')"><h3>ဆက်တင်နှင့် Backup</h3><div class="muted">အချက်အလက်နှင့် ဒေတာလုံခြုံမှု</div></button></div>`}function toggleFab(){document.getElementById('fabMenu').classList.toggle('show')}function quickAdd(type){document.getElementById('fabMenu').classList.remove('show');openForm(type)}function globalSearch(q){const box=document.getElementById('searchResults');q=q.trim().toLowerCase();if(!q){box.classList.remove('show');return}const all=[...db.students.map(x=>({t:x.name,s:'ကျောင်းသား'})),...db.lessons.map(x=>({t:x.lesson,s:'သင်ခန်းစာ'})),...db.classes.map(x=>({t:x.subject+' '+x.batch,s:'စာသင်ချိန်'})),...db.tasks.map(x=>({t:x.title,s:x.type}))];const hit=all.filter(x=>x.t.toLowerCase().includes(q)).slice(0,6);box.innerHTML=hit.length?hit.map(x=>`<div class="item" style="padding:9px;border:0"><div><strong>${esc(x.t)}</strong><div class="muted">${esc(x.s)}</div></div></div>`).join(''):'<div class="empty">ရှာမတွေ့ပါ</div>';box.classList.add('show')}
function showView(v){current=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render();scrollTo(0,0)}
function render(){renderDashboard();renderSchedule();renderLessons();renderStudents();renderTasks();renderFees();renderBackup();renderOther()}
function cardStat(label,value,icon){return `<div class="card stat"><div><div class="label">${label}</div><div class="value">${value}</div></div><div class="emoji">${icon}</div></div>`}
function renderDashboard(){const today=todayName(), now=new Date(), classes=db.classes.filter(x=>x.day===today).sort((a,b)=>a.start.localeCompare(b.start)), unpaid=db.fees.filter(x=>x.status!=='Paid'), pending=db.lessons.filter(x=>x.status!=='Completed'), upcoming=db.tasks.filter(x=>x.date>=dateKey()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);const next=classes.map(x=>{const d=new Date();const [h,m]=x.start.split(':');d.setHours(h,m,0,0);return {...x,d}}).find(x=>x.d>=now)||classes[0];const mins=next?Math.max(0,Math.round((next.d-now)/60000)):0;const timeline=classes.map(x=>{const [h,m]=x.start.split(':');const d=new Date();d.setHours(h,m,0,0);const state=d<now?'done':(!next||x.id!==next.id?'upcoming':'current');return `<div class="time-item ${state}"><span class="time-label">${esc(x.start)}</span><strong>${esc(x.subject)}</strong><div class="muted">${esc(x.batch)} • ${esc(x.start)} – ${esc(x.end)}</div></div>`}).join('');document.getElementById('dashboard').innerHTML=`<div class="hello"><div><div class="eyebrow">${today} • <span id="clock">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="h1">မင်္ဂလာပါ ${esc(db.teacher||'ဆရာ/ဆရာမ')} 👋</div><div class="date">ဒီနေ့ကို စနစ်တကျ စလိုက်ရအောင် • ${new Date().toLocaleDateString('my-MM',{year:'numeric',month:'long',day:'numeric'})}</div></div></div><div class="card next-card"><div class="eyebrow">နောက်အတန်း</div>${next?`<h2 style="font-size:24px;margin:6px 0">${esc(next.subject)}</h2><div>${esc(next.batch)} • ${esc(next.start)} – ${esc(next.end)}</div><div class="next-time">⏱ ${mins} မိနစ်အတွင်း</div><button class="btn" onclick="showView('lessons')">စာပြင်ဆင်ရန်</button>`:`<h2 style="margin:8px 0">ဒီနေ့ နောက်ထပ်အတန်း မရှိသေးပါ</h2><div>အေးအေးဆေးဆေး စီစဉ်နိုင်ပါပြီ</div>`}</div><div class="grid stats" style="margin-top:16px">${cardStat('ဒီနေ့ စာသင်ချိန်',classes.length,'▦')}${cardStat('စာပြင်ဆင်ရန်',pending.length,'✎')}${cardStat('အိမ်စာစစ်ရန်',db.tasks.filter(x=>x.type==='Homework'&&x.date<=dateKey()).length,'✓')}${cardStat('မပေးရသေး',unpaid.length,'◉')}</div><div class="grid two"><div class="card"><div class="section-head" style="margin:0 0 12px"><h2>ဒီနေ့ စာသင်ချိန်</h2><button class="btn small" onclick="showView('schedule')">အကုန်ကြည့်မည်</button></div>${classes.length?`<div class="timeline">${timeline}</div>`:`<div class="empty">ဒီနေ့ စာသင်ချိန် မရှိသေးပါ<br><button class="btn small" onclick="openForm('class')">စာသင်ချိန်ထည့်ရန်</button></div>`}</div><div class="card"><h2>လာမည့်အရာများ</h2>${upcoming.length?`<div class="list">${upcoming.map(x=>`<div class="item"><div><div class="item-title">${esc(x.title)}</div><div class="muted">${fmtDate(x.date)} • ${esc(x.type)}</div></div><span class="pill">${esc(x.subject)}</span></div>`).join('')}</div>`:'<div class="empty">လာမည့်အိမ်စာနှင့် စာမေးပွဲ မရှိသေးပါ</div>'}</div></div><div class="section-head"><h2>မပြီးသေးသော စာပြင်ဆင်မှု</h2><button class="btn small" onclick="showView('lessons')">စီမံမည်</button></div><div class="card">${pending.length?pending.slice(0,5).map(lessonProgress).join(''):'<div class="empty">စာပြင်ဆင်မှုအားလုံး ပြီးပါပြီ</div>'}</div>`}
function classItem(x){return `<div class="item"><div class="item-main"><div class="item-title">${esc(x.subject)} <span class="muted">• ${esc(x.batch)}</span></div><div class="muted">${esc(x.start)}–${esc(x.end)} • ${esc(x.location||'No location')}</div>${x.notes?`<div class="muted">${esc(x.notes)}</div>`:''}</div><span class="pill">${x.reminder} min reminder</span></div>`}
function renderSchedule(){const sorted=[...db.classes].sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.start.localeCompare(b.start));document.getElementById('schedule').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">အပတ်စဉ် စာသင်ချိန်</div><h1 class="h1">စာသင်ချိန်</h1></div><button class="btn primary" onclick="openForm('class')">＋ အတန်းထည့်ရန်</button></div><div class="calendar-strip">${DAYS.map(d=>`<div class="day-chip ${d===todayName()?'active':''}"><span>${d.slice(0,3)}</span><strong>${sorted.filter(x=>x.day===d).length}</strong></div>`).join('')}</div><div class="card">${sorted.length?`<div class="list">${sorted.map(x=>editableItem(x,'class',`${x.day} • ${x.start}–${x.end}`,`${x.batch} • ${x.location||'No location'}`)).join('')}</div>`:'<div class="empty">Your timetable is empty.</div>'}</div><div class="card" style="margin-top:16px"><h2>စာသင်ချိန် အသိပေးစနစ်</h2><p class="muted">When this page is open, the app calculates reminder times, shows a countdown, and can play an alarm. Browser-only alarms cannot guarantee notifications when the browser is completely closed.</p><button class="btn" onclick="requestNotifications()">အသိပေးချက် ဖွင့်မည်</button><div id="countdown" class="pill" style="margin-top:10px">Checking next class…</div></div>`}
function editableItem(x,type,meta,sub){return `<div class="item"><div class="item-main"><div class="item-title">${esc(x.subject||x.title||x.name)}</div><div class="muted">${esc(meta)}</div><div class="muted">${esc(sub)}</div></div><div class="actions"><button class="btn small" onclick="openForm('${type}','${x.id}')">Edit</button><button class="btn small danger" onclick="removeItem('${type}','${x.id}')">Delete</button></div></div>`}
function lessonProgress(x){const done=x.status==='Completed'?100:x.status==='Ready'?70:25;return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><strong>${esc(x.subject)} — ${esc(x.lesson||x.chapter||'Untitled')}</strong><span class="muted">${done}%</span></div><div class="progress"><i style="width:${done}%"></i></div><span class="pill ${x.status==='Completed'?'good':x.status==='Ready'?'warn':''}">${esc(x.status)}</span></div>`}
function renderLessons(){document.getElementById('lessons').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">စာပြင်ဆင်မှုနှင့် သင်ရိုး</div><h1 class="h1">သင်ခန်းစာ</h1></div><button class="btn primary" onclick="openForm('lesson')">＋ သင်ခန်းစာထည့်ရန်</button></div><div class="card">${db.lessons.length?`<div class="list">${db.lessons.map(x=>editableItem(x,'lesson',`${x.chapter||'No chapter'} • ${x.status}`,`${x.batch||'No batch'}${x.objectives?' • '+x.objectives:''}`)).join('')}</div>`:'<div class="empty">Create a lesson preparation to start tracking syllabus progress.</div>'}</div>`}
function renderStudents(){const batches=[...new Set(db.students.map(x=>x.batch).filter(Boolean))];document.getElementById('students').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">အတန်းနှင့် တက်ရောက်မှု</div><h1 class="h1">ကျောင်းသားများ</h1></div><button class="btn primary" onclick="openForm('student')">＋ ကျောင်းသားထည့်ရန်</button></div><div class="grid three">${(db.batches||[]).map(b=>`<div class="card"><h3>${esc(b)}</h3><div class="stat"><span class="muted">Students</span><strong>${db.students.filter(x=>x.batch===b).length}</strong></div></div>`).join('')}</div><div class="card" style="margin-top:16px">${db.students.length?`<div class="list">${db.students.map(x=>editableItem(x,'student',`${x.batch} • ${x.attendance||'Not marked'}`,x.phone||x.notes||'')).join('')}</div>`:'<div class="empty">No students yet. Add a batch member to track attendance.</div>'}</div>`}
function renderTasks(){const arr=[...db.tasks].sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('tasks').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">အိမ်စာ၊ စာမေးပွဲနှင့် အလုပ်များ</div><h1 class="h1">အစီအစဉ်</h1></div><button class="btn primary" onclick="openForm('task')">＋ အလုပ်ထည့်ရန်</button></div><div class="card">${arr.length?`<div class="list">${arr.map(x=>editableItem(x,'task',`${fmtDate(x.date)} • ${x.type}`,`${x.subject} • ${x.batch}`)).join('')}</div>`:'<div class="empty">No homework, class tests, or exams planned.</div>'}</div>`}
function renderFees(){const paid=db.fees.filter(x=>x.status==='Paid').reduce((s,x)=>s+Number(x.amount||0),0), unpaid=db.fees.filter(x=>x.status!=='Paid').reduce((s,x)=>s+Number(x.amount||0),0);document.getElementById('fees').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">ကျူရှင်ကြေး စီမံမှု</div><h1 class="h1">ကျူရှင်ကြေး</h1></div><button class="btn primary" onclick="openForm('fee')">＋ ကျူရှင်ကြေးထည့်ရန်</button></div><div class="grid stats">${cardStat('Total paid',paid.toLocaleString()+' MMK','✓')}${cardStat('Total unpaid',unpaid.toLocaleString()+' MMK','!')}${cardStat('Outstanding',db.fees.filter(x=>x.status!=='Paid').length,'◉')}${cardStat('Records',db.fees.length,'#')}</div><div class="card">${db.fees.length?`<div class="list">${db.fees.map(x=>`<div class="item"><div><div class="item-title">${esc(x.student)} <span class="muted">• ${esc(x.month)}</span></div><div class="muted">${esc(x.batch)} • ${Number(x.amount||0).toLocaleString()} MMK</div></div><div class="actions"><span class="pill ${x.status==='Paid'?'good':'bad'}">${x.status}</span>${x.status!=='Paid'?`<button class="btn small" onclick="markPaid('${x.id}')">Mark paid</button>`:''}<button class="btn small danger" onclick="removeItem('fee','${x.id}')">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No fee records yet.</div>'}</div>`}
function renderBackup(){document.getElementById('backup').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="kicker">Data safety</div><h1 class="h1">Settings & Backup</h1></div></div><div class="grid two"><div class="card"><h2>Backup / Restore</h2><p class="muted">Export all app data as JSON or restore a previous backup. Imported files are validated before replacing your current data.</p><button class="btn primary" onclick="exportData()">Export JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div><div class="card"><h2>Danger zone</h2><p class="muted">Resetting permanently removes all local data from this browser.</p><button class="btn danger" onclick="resetData()">Reset all data</button></div></div>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
function subjectSelect(name='subject',value=''){return `<select name="${name}" required><option value="">Choose subject</option>${SUBJECTS.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`};function batchSelect(value=''){return `<input name="batch" list="batchList" value="${escAttr(value)}" placeholder="Grade 10 A" required><datalist id="batchList">${(db.batches||[]).map(x=>`<option>${esc(x)}</option>`).join('')}</datalist>`}
function openSetup(settings=false){openModal(settings?'Teacher settings':'Set up your teaching workspace',`<form onsubmit="saveSetup(event)"><div class="field"><label>Teacher name</label><input name="teacher" value="${escAttr(db.teacher)}" required placeholder="e.g. Daw May"></div><div class="field"><label>Main subjects</label><div class="checkrow">${SUBJECTS.map(s=>`<label><input type="checkbox" name="subjects" value="${s}" ${db.mainSubjects.includes(s)?'checked':''}> ${s}</label>`).join('')}</div></div><div class="field"><label>Working days</label><div class="checkrow">${DAYS.map(s=>`<label><input type="checkbox" name="days" value="${s}" ${db.workingDays.includes(s)?'checked':''}> ${s.slice(0,3)}</label>`).join('')}</div></div><div class="form-grid"><div class="field"><label>Default class duration (minutes)</label><input type="number" name="duration" min="15" max="300" value="${db.duration}"></div><div class="field"><label>Default reminder (minutes)</label><select name="reminder">${[5,15,30,60].map(x=>`<option ${x==db.reminder?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save setup</button></div></form>`)}
function saveSetup(e){e.preventDefault();const f=new FormData(e.target);db.teacher=f.get('teacher');db.mainSubjects=f.getAll('subjects');db.workingDays=f.getAll('days');db.duration=Number(f.get('duration'))||90;db.reminder=Number(f.get('reminder'))||15;db.setup=true;save();closeModal();document.getElementById('welcome').hidden=true;document.getElementById('app').hidden=false;render();toast('Setup saved')}
function openForm(type,id){const old=id?({class:db.classes,lesson:db.lessons,student:db.students,task:db.tasks,fee:db.fees}[type]||[]).find(x=>x.id===id):{};const x=old||{};let body='';if(type==='class')body=`<form onsubmit="submitForm(event,'class','${id||''}')"><div class="form-grid"><div class="field"><label>Day</label><select name="day">${DAYS.map(d=>`<option ${d===x.day?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Subject</label>${subjectSelect('subject',x.subject)}</div><div class="field"><label>Start time</label><input type="time" name="start" value="${x.start||'16:00'}" required></div><div class="field"><label>End time</label><input type="time" name="end" value="${x.end||'17:30'}" required></div><div class="field"><label>Grade / Batch</label>${batchSelect(x.batch)}</div><div class="field"><label>Location</label><input name="location" value="${escAttr(x.location)}" placeholder="Classroom / Online"></div><div class="field"><label>Reminder</label><select name="reminder">${[5,15,30,60].map(v=>`<option ${v==(x.reminder||db.reminder)?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label><input type="checkbox" name="repeat" ${x.repeat!==false?'checked':''}> Repeat weekly</label></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save class</button></div></form>`;if(type==='lesson')body=`<form onsubmit="submitForm(event,'lesson','${id||''}')"><div class="form-grid"><div class="field"> <label>Subject</label>${subjectSelect('subject',x.subject)}</div><div class="field"><label>Grade / Batch</label>${batchSelect(x.batch)}</div><div class="field"><label>Chapter</label><input name="chapter" value="${escAttr(x.chapter)}" required></div><div class="field"><label>Lesson / Topic</label><input name="lesson" value="${escAttr(x.lesson)}" required></div><div class="field"><label>Status</label><select name="status">${['Not Ready','Ready','Completed'].map(v=>`<option ${v===(x.status||'Not Ready')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Total class duration (minutes)</label><input type="number" name="duration" value="${x.duration||db.duration}" min="15" oninput="planner(this.value)"></div><div class="field full"><label>Learning objectives</label><textarea name="objectives">${esc(x.objectives)}</textarea></div><div class="field"><label>Important formulas / concepts</label><textarea name="concepts">${esc(x.concepts)}</textarea></div><div class="field"><label>Examples</label><textarea name="examples">${esc(x.examples)}</textarea></div><div class="field"><label>Exercises</label><textarea name="exercises">${esc(x.exercises)}</textarea></div><div class="field"><label>Homework</label><textarea name="homework">${esc(x.homework)}</textarea></div><div class="field"><label>Required materials</label><textarea name="materials">${esc(x.materials)}</textarea></div><div class="field"><label>Personal notes</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div id="planner" class="setup-note">${plannerText(x.duration||db.duration)}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save lesson</button></div></form>`;if(type==='student')body=`<form onsubmit="submitForm(event,'student','${id||''}')"><div class="form-grid"><div class="field"><label>Student name</label><input name="name" value="${escAttr(x.name)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${escAttr(x.phone)}" inputmode="tel"></div><div class="field"><label>Batch</label>${batchSelect(x.batch)}</div><div class="field"><label>Attendance</label><select name="attendance">${['Not marked','Present','Absent','Late'].map(v=>`<option ${v===(x.attendance||'Not marked')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save student</button></div></form>`;if(type==='task')body=`<form onsubmit="submitForm(event,'task','${id||''}')"><div class="form-grid"><div class="field"><label>Type</label><select name="type">${['Homework','Class Test','Exam'].map(v=>`<option ${v===(x.type||'Homework')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${x.date||dateKey()}" required></div><div class="field"><label>Subject</label>${subjectSelect('subject',x.subject)}</div><div class="field"><label>Batch</label>${batchSelect(x.batch)}</div><div class="field full"><label>Title</label><input name="title" value="${escAttr(x.title)}" required></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save task</button></div></form>`;if(type==='fee')body=`<form onsubmit="submitForm(event,'fee','${id||''}')"><div class="form-grid"><div class="field"><label>Student name</label><input name="student" value="${escAttr(x.student)}" required></div><div class="field"><label>Batch</label>${batchSelect(x.batch)}</div><div class="field"><label>Month</label><input type="month" name="month" value="${x.month||new Date().toISOString().slice(0,7)}" required></div><div class="field"><label>Amount (MMK)</label><input type="number" name="amount" min="0" value="${x.amount||0}" required></div><div class="field"><label>Status</label><select name="status"><option ${x.status!=='Paid'?'selected':''}>Unpaid</option><option ${x.status==='Paid'?'selected':''}>Paid</option></select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save fee</button></div></form>`;openModal((id?'Edit ':'Add ')+type,body)}
function submitForm(e,type,id){e.preventDefault();const f=new FormData(e.target), obj=Object.fromEntries(f.entries());obj.id=id||uid();if(type==='class')obj.reminder=Number(obj.reminder);if(type==='lesson')obj.duration=Number(obj.duration);const arr={class:'classes',lesson:'lessons',student:'students',task:'tasks',fee:'fees'}[type];const i=db[arr].findIndex(x=>x.id===obj.id);if(i>=0)db[arr][i]=obj;else db[arr].push(obj);if(obj.batch&&!db.batches.includes(obj.batch))db.batches.push(obj.batch);save();closeModal();render();toast('Saved successfully')}
function removeItem(type,id){if(!confirm('Delete this item?'))return;const arr={class:'classes',lesson:'lessons',student:'students',task:'tasks',fee:'fees'}[type];db[arr]=db[arr].filter(x=>x.id!==id);save();render();toast('Deleted')};function markPaid(id){const x=db.fees.find(x=>x.id===id);if(x){x.status='Paid';save();render();toast('Fee marked as paid')}}
function plannerText(n){n=Number(n)||90;const ratios=[['Review',.11],['New Lesson',.33],['Examples',.22],['Student Practice',.22],['Homework / Summary',.12]];let vals=ratios.map((r,i)=>i===4?Math.max(1,n-ratios.slice(0,4).reduce((s,a)=>s+Math.round(n*a[1]),0)):Math.round(n*r[1]));return `<strong>Automatic time planner</strong><div class="muted">${ratios.map((r,i)=>`${r[0]}: ${vals[i]} min`).join(' • ')}</div><small>These blocks can be manually adjusted in your personal notes.</small>`};function planner(v){const p=document.getElementById('planner');if(p)p.innerHTML=plannerText(v)}
function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',db.theme==='dark');save()};function requestNotifications(){if(!('Notification'in window)){toast('Notifications are not supported in this browser');return}Notification.requestPermission().then(x=>toast(x==='granted'?'Notifications enabled':'Permission not granted'))}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='teacher-assistant-backup-'+dateKey()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')};function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.classes)||!Array.isArray(x.lessons)||!Array.isArray(x.students))throw Error();db={...blank,...x};save();render();toast('Backup restored')}catch(_){toast('Invalid backup file; nothing changed')}};r.readAsText(file)};function resetData(){if(confirm('Reset all app data? This cannot be undone.')){localStorage.removeItem(KEY);db={...blank};document.getElementById('app').hidden=true;document.getElementById('welcome').hidden=false;toast('All data reset')}}
function demo(){db={...db,setup:true,teacher:'Daw Thiri',mainSubjects:['Mathematics','Physics','Chemistry'],classes:[{id:uid(),day:todayName(),start:'16:00',end:'17:30',subject:'Mathematics',batch:'Grade 10 A',location:'Room 2',notes:'Quadratic equations',reminder:15,repeat:true},{id:uid(),day:'Saturday',start:'10:00',end:'11:30',subject:'Physics',batch:'Weekend Class',location:'Online',notes:'Electricity',reminder:30,repeat:true}],lessons:[{id:uid(),subject:'Mathematics',batch:'Grade 10 A',chapter:'Chapter 3',lesson:'Quadratic Equations',status:'Ready',duration:90,objectives:'Solve and apply quadratic equations',concepts:'Discriminant and roots',examples:'x²−5x+6=0',exercises:'Textbook 3.1',homework:'Questions 1–5',materials:'Whiteboard',notes:''}],students:[{id:uid(),name:'Aung Aung',phone:'09 421 000 111',batch:'Grade 10 A',attendance:'Present',notes:''},{id:uid(),name:'Ei Ei',phone:'09 421 000 222',batch:'Grade 10 A',attendance:'Not marked',notes:''}],tasks:[{id:uid(),type:'Homework',subject:'Mathematics',batch:'Grade 10 A',title:'Quadratic practice',date:dateKey(),notes:'Questions 1–5'}],fees:[{id:uid(),student:'Aung Aung',batch:'Grade 10 A',month:new Date().toISOString().slice(0,7),amount:50000,status:'Unpaid'}]};save();document.getElementById('welcome').hidden=true;document.getElementById('app').hidden=false;render();toast('Demo data loaded')}
function continueApp(){if(db.setup){document.getElementById('welcome').hidden=true;document.getElementById('app').hidden=false;render()}else openSetup()}
function alarmTick(){const el=document.getElementById('countdown');if(!el)return;const now=new Date(),today=todayName(), list=db.classes.filter(x=>x.day===today).map(x=>{const d=new Date();const [h,m]=x.start.split(':');d.setHours(h,m,0,0);return {...x,d}}).filter(x=>x.d>now).sort((a,b)=>a.d-b.d);if(!list.length){el.textContent='No more classes today';return}const diff=Math.round((list[0].d-now)/60000);el.textContent=`Next: ${list[0].subject} — ${diff} min (${list[0].start})`;if(diff===Number(list[0].reminder)&&'Notification'in window&&Notification.permission==='granted')new Notification(`${list[0].subject} reminder`,{body:`${list[0].subject} – ${list[0].batch} starts in ${diff} minutes`})}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showView(b.dataset.view));document.body.classList.toggle('dark',db.theme==='dark');if(db.setup){document.getElementById('app').hidden=false;render()}else document.getElementById('welcome').hidden=false;setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});alarmTick()},1000);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script>
